name: WLD Live Copilot CI Relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/live-copilot-ci-trigger.txt'

permissions:
  contents: read

concurrency:
  group: wld-live-copilot-ci-relay
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require private-repository credential
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN" || exit 2

      - name: Checkout private Live Copilot source only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: EmmanuelDelva/claude-work
          ref: agent/wld-live-copilot-v1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            wld-live-copilot
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Run private verification quietly
        id: checks
        shell: bash
        env:
          BINANCE_API_KEY: ''
          BINANCE_API_SECRET: ''
          EXECUTION_TEST_ORDER_ENABLED: 'false'
          CLIENT_ACCESS_TOKEN: ''
        run: |
          set +e
          LOG=/tmp/wld-live-copilot-ci.log
          : > "$LOG"

          python -m pip install -r private/wld-live-copilot/backend/requirements.txt >>"$LOG" 2>&1
          rc=$?

          if [ "$rc" -eq 0 ]; then
            PYTHONPATH=private/wld-live-copilot/backend python -m compileall -q \
              private/wld-live-copilot/backend/app \
              private/wld-live-copilot/backend/tests >>"$LOG" 2>&1
            rc=$?
          fi

          if [ "$rc" -eq 0 ]; then
            PYTHONPATH=private/wld-live-copilot/backend pytest -q \
              private/wld-live-copilot/backend/tests >>"$LOG" 2>&1
            rc=$?
          fi

          if [ "$rc" -eq 0 ]; then
            docker build -t wld-live-copilot-ci private/wld-live-copilot >>"$LOG" 2>&1
            rc=$?
          fi

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Store failure diagnostics only in private repository
        if: steps.checks.outputs.rc != '0'
        shell: bash
        working-directory: private
        run: |
          set -euo pipefail
          branch="diagnostics/live-copilot-public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p .ci/live-copilot
          cp /tmp/wld-live-copilot-ci.log ".ci/live-copilot/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          git config user.name 'wld-ci-relay'
          git config user.email 'wld-ci-relay@users.noreply.github.com'
          git switch -c "$branch"
          git add -f .ci/live-copilot/
          git commit -m "Live Copilot CI diagnostics ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          git push origin "$branch"
          echo "FAIL: private diagnostics branch created: $branch"
          exit 1

      - name: Public safety summary
        if: steps.checks.outputs.rc == '0'
        shell: bash
        run: |
          echo 'PASS: private Live Copilot compile, full backend tests and container build completed.'
          echo 'PASS: no Binance credential, trade signal, account data or private source artifact was published.'
          echo 'PASS: real-order execution remains outside this relay.'
