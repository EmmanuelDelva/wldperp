name: WLD Sentinel Source CI Relay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/source-ci-trigger.txt'

permissions:
  contents: read

concurrency:
  group: wld-sentinel-source-ci-relay
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require private-repository credential
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN" || exit 2

      - name: Checkout private WLD Sentinel source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: EmmanuelDelva/claude-work
          ref: agent/wld-sentinel-ios-v1
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout: |
            wld-sentinel-ios
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        shell: bash
        run: python -m pip install -e './private/wld-sentinel-ios/backend[dev]'

      - name: Run private backend test suite
        shell: bash
        working-directory: private/wld-sentinel-ios/backend
        run: python -m pytest -q

      - name: Smoke test fresh forward shadow against official Binance public data
        shell: bash
        working-directory: private/wld-sentinel-ios/backend
        env:
          APP_ENV: development
          TRADING_MODE: analysis
          FORWARD_SHADOW_ENABLED: 'true'
          BINANCE_API_KEY: ''
          BINANCE_API_SECRET: ''
        run: |
          python - <<'PY'
          import asyncio
          from app.forward_shadow_service import ForwardShadowService

          service = ForwardShadowService()
          result = asyncio.run(service.refresh())
          assert result.get('enabled') is True
          assert result.get('status') == 'ACTIVE_FRESH_MARKET_SHADOW', result.get('status')
          assert result.get('can_execute_orders') is False
          assert result.get('real_money_enabled') is False
          assert result.get('automatic_live_enabled') is False
          assert result.get('historical_promotion_allowed') is False
          assert result.get('automatic_policy_mutation') is False
          assert result.get('base_calendar_aligned') is True
          assert result.get('btc_calendar_aligned') is True
          assert result.get('source', '').startswith('Binance')
          print('PASS: fresh forward shadow rebuilt from official Binance data with geo-safe fallback; execution remains disabled.')
          PY

      - name: Build deployment container
        shell: bash
        run: docker build -t wld-sentinel-ci ./private/wld-sentinel-ios

      - name: Safety assertion
        shell: bash
        run: |
          echo 'PASS: private source tests, fresh-shadow smoke test and container build completed.'
          echo 'PASS: no private artifact, trade signal or trading credential was published.'
